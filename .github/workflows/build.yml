name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Show buildozer.spec
        run: |
          echo "=== Содержимое buildozer.spec ==="
          cat buildozer.spec
          echo "=== Проверка кодировки ==="
          file buildozer.spec
          echo "=== Размер ==="
          wc -c buildozer.spec
            - name: Check bin folder
        if: always()
        run: |
          echo "=== bin ==="
          ls -la bin/ || echo "no bin"
          echo "=== .buildozer logs ==="
          find .buildozer -name "*.log" 2>/dev/null | head

      - name: Check bin folder
        run: |
          echo "=== Проверка папки bin ==="
          ls -la bin/ || echo "❌ Папка bin не найдена"
          ls -la bin/*.apk || echo "❌ APK файл не найден"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grainmaster-apk
          path: bin/*.apk
