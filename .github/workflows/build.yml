name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Show buildozer.spec
        run: |
          echo "=== buildozer.spec содержимое ==="
          cat buildozer.spec
          echo "=== размер ==="
          wc -c buildozer.spec

      - name: Build APK
        run: |
          set +o pipefail
          yes | buildozer android debug

      - name: Check bin folder
        if: always()
        run: |
          echo "=== Проверка bin ==="
          ls -la bin/ || echo "❌ Папка bin не найдена"
          ls -la bin/*.apk || echo "❌ APK не найден"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grainmaster-apk
          path: bin/*.apk
