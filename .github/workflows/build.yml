name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          set +o pipefail
          yes | buildozer android debug || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grainmaster-apk
          path: bin/*.apk
          if-no-files-found: warn
